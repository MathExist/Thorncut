 storm:['Stormwood','pine','rain',['#10161e','#222e3a','#3e5060','#6a8088','#a8b8b4'],['#343c40','#1e2428','#566066','#5a8a70'],'It has been raining in this wood for nine years. Lightning splits the trees by the hour, and Tempest Hao walks through it without getting wet.'],
 fungus:['The Glowcap Deep','mush','fireflies',['#160c2a','#2e1a4c','#54307a','#8a5aa8','#c8f0a0'],['#3a2a4c','#22162e','#5e4876','#90e070'],'Mushrooms the size of houses glow under a roof of leaves. The whole wood here is one living thing, and the Spore Mother speaks for it.'],
 orchard:['The Wild Orchard','broad','leaves',['#4a2a3a','#8a4a4a','#c88060','#eeb880','#fce4b0'],['#5a3e2c','#38261c','#84623e','#a8a040'],'Someone planted these plum trees in straight rows long ago. They grew wild when the keepers came, and the fruit fell and rotted for nine autumns.'],
 crown:['The Crown of Oaks','broad','ash',['#1e1a10','#3e3620','#6e6030','#aa9648','#ecdc90'],['#4e4228','#2e2818','#7a6a3c','#b0a040'],'The first trees in the forest stand in a ring around the Court. One of them has been awake the whole time, and it has been waiting for someone to ask.'],
 ferry:['Mistwood Crossing','broad','rain',['#26384a','#3c5866','#6a8c8a','#a4c0a8','#dce4c4'],['#4a3a2c','#2c221c','#7a5e3e','#6aa060'],'Rain walks through the old wood. The Lantern Court keeps a ledger of every living name, and when a name is struck, the world forgets its owner. Twenty-five keepers hold twenty-five pages somewhere under these trees. You start where you were last called by name.'],
 market:['The Lantern Glade','broad','fireflies',['#14102c','#2c2050','#4e3478','#8a4a84','#e0986a'],['#3e2c3c','#241a28','#6c4a58','#7a8a58'],'At dusk the forest folk trade under paper lanterns hung from the branches. Madam Abacus prices everything here, including the names the Court has struck.'],
 bamboo:['The Penitent Bamboo','bamboo','leaves',['#2a4638','#44705a','#7ca080','#b4cc9c','#e4e8c4'],['#4a4028','#2e2a1e','#6e6238','#7cb060'],'The brothers of the grove copy out struck names, then burn the copies as penance. The bamboo here grows grey at the root.'],
 mine:['Deeproot Hollow','dead','fireflies',['#0c1420','#1a2a34','#2e4a4a','#4e7a68','#9ad8b0'],['#34403a','#1e2824','#566a58','#6ac0a0'],'The forest sinks here and the roots run on for miles. People struck from the ledger are sent below to dig, because nobody comes looking.'],
 mangrove:['The Rootwater Mangrove','mangrove','leaves',['#16302a','#28503e','#4a7a54','#8aae6a','#d4dc9a'],['#3e4a30','#262e20','#5e6e42','#8ec060'],'The river splits into a thousand channels under the roots. Struck families live here on stilts, and the Mire Widow sells them out one by one.'],
 granary:['The Burning Wood','dead','embers',['#3a1c20','#7a3428','#c0622e','#eea04a','#ffd88a'],['#4a2c20','#2c1a16','#7c4c30','#d07030'],'A whole valley of trees is on fire. Quartermaster Hu burns the forest on his books and sells its timber by moonlight. Tonight he is burning the evidence.'],
 canal:['The Drowned Fen','mangrove','rain',['#14283a','#22485a','#3e7078','#78a898','#c8d8b0'],['#3a4a40','#222e2a','#5a7264','#80b890'],'The sluices shut and the low forest flooded. Toll-Keeper Ma still charges every traveler, and she counts the drowned as paid.'],
 dunes:['The Amber Thicket','dead','ash',['#5a3a2a','#a06a3a','#d89a48','#f0c868','#fce8a8'],['#6a5030','#463420','#927040','#d8b860'],'Autumn never ends here. The leaves fell a hundred years ago and never rotted. Caravan Master Qiu moves the Court\'s sealed crates along the deer paths.'],
 stair:['Snowpine Ridge','pine','snow',['#46587a','#6c84a4','#9cb4cc','#cfdce8','#f8fafa'],['#4c5a68','#2e3a48','#74848e','#eef4f8'],'High on the ridge the pines stand buried in snow. Silent nuns keep the only true copy of the ledger, and they will not read from it.'],
 tomb:['The Moonlit Barrows','dead','fireflies',['#100c1c','#241c38','#463a60','#7a6ca0','#c0e0c8'],['#3e3a50','#242034','#625c7c','#7ad0a0'],'Old burial mounds sleep among the white trees. The Court buries its secrets standing up, and the Warden keeps the lamps lit for people no one remembers.'],
 archive:['The Paper Birches','broad','ash',['#2a1c18','#4e3024','#845436','#ba9050','#ecd08c'],['#4a382a','#2a201a','#74583c','#d8cc90'],'Birch bark peels from these trees like pages. Every copy of a struck name ends up here to be burned, and the Archivist knows each tree by touch.'],
 forge:['Ironbark Forge','dead','embers',['#1c0c10','#4a1416','#902c1c','#e0642c','#ffc860'],['#3a2c2c','#221a1e','#685454','#e08030'],'The ironbark trees burn hotter than coal. Every gun the Court owns comes out of this wood, and Master Smith Tie forged your father\'s pistol.'],
 wall:['The Thornwall','pine','leaves',['#2a1a2e','#5a2c3c','#a04c40','#e08c50','#f8cc80'],['#5a4834','#3a2e22','#847058','#90a050'],'A hedge of black thorns as high as a castle marks the border of the Court\'s land. General Shou has guarded it for thirty years against an enemy nobody can remember.'],
 cloud:['The Elder Canopy','mush','fireflies',['#2a5a7a','#4a8a98','#86b8a8','#c4e0b4','#f4f8d8'],['#5a6a4a','#38462e','#869a68','#c4e070'],'The oldest trees in the world grow so tall that their tops have their own weather. Giant mushrooms ring the trunks, and the Sage has watched you climb all the way.'],
 court:['The Red Moon Wood','dead','ash',['#200c18','#4c1422','#8c2430','#d0543c','#f0a874'],['#4a1e2c','#2a101c','#7a2c34','#c08040'],'A thousand lanterns hang in the dead trees, one for each name the Court still allows. In the clearing a brush the height of a man waits on its stand. You remember this place.']

const STORY={
 lighthouse:{open:['The lamp turns all night over a drowned forest.','The keeper has not spoken to a living soul in nine years.'],mid:'A fisherman says, "It used to save ships. Then someone wrote down which ones."',end:'You put out the lamp. For the first time in nine years the coast is dark, and the sailors are safer for it.'},
 reedsea:{open:['The grass closes behind you as you walk.','Your own footprints are gone within the hour.'],mid:'A herder hands you a whistle. "If you lose the sky, blow this. Something will answer. Hope it is me."',end:'The wind drops. Across the whole sea of reeds, for a moment, nothing moves at all.'},
 glasslake:{open:['Each step rings under your boots.','Below the ice, the old road runs on without you.'],mid:'An old woman fishes through a hole. "I am not after fish," she says, and does not explain.',end:'The ice groans and holds. You do not look down again until you reach the far shore.'},
 caldera:{open:['The air tastes of coins.','Every lamp in the Court is fed from this one wound in the earth.'],mid:'A miner laughs without any sound. "They told us the fire would thank us."',end:'The heat falls away behind you. In the Court, far off, a thousand lanterns dim for a single breath.'},
 bellroad:{open:['The bells are quiet as you arrive.','They begin to ring only when you try to leave.'],mid:'A child says, "One of them is yours. It is the quiet one." She will not say which.',end:'You find the bell with your family\'s mark. You hold it still in both hands, and the road goes silent.'},
 ferry:{open:['The trees here still know the sound of your family name, even if nobody else does.','The first keeper, Old Mother Gaff, once ferried your father across the river. Her page is the only place he still exists.'],mid:'A woman in the village stares at you. "I had a neighbor once. I cannot remember who."',end:'Old Mother Gaff lets go of her hook and smiles. "He paid his fare," she says. "Tell him I remembered."'},
 market:{open:['Nothing is sold at the Lantern Glade without a price, and tonight the price of your name is three coppers.','Whoever bought it left a trail of receipts through the stalls.'],mid:'A stall keeper whispers, "Abacus keeps two sets of books. One is for the living."',end:'Madam Abacus closes her ledger and pushes one copper across the table. "Change," she says. "It was always a bad deal."'},
 bamboo:{open:['Smoke drifts between the stalks. The brothers burn a name every morning and pray for it every night.','Reed and Rush took their vows together. They will not fight you alone.'],mid:'An old monk sweeps ash from the path. "We burn them gently," he says, as if that helps.',end:'Rush kneels beside his brother and lights no fire. For the first time in years, a name goes unburned.'},
 silver:{open:['Hunters follow the white stag and come home with no memory of the chase.','You need to find it. It walked past your house on the last night anyone remembers.'],mid:'A hunter carves another notch into his bow. He cannot say what it counts.',end:'The Stag lowers its head and shows you the road you ran down as a child. You had forgotten that you ran.'},
 mine:{open:['Roots hang through the roof of the world here. Below them, the struck dig salt for the Court.','A number has been scratched on every wall: 4117.'],mid:'A digger shares his water. "4117 taught us to count the days. Nobody else thought to."',end:'Foreman Sun hands you a worn tally stick. Nine years of marks stop in the spring. Your brother was here.'},
 mangrove:{open:['The families who escaped the Court live on stilts where the roads end.','Someone has been selling them, one house at a time.'],mid:'A child on a walkway asks if you are her aunt. You almost say yes.',end:'The Mire Widow sinks into black water still counting. The families light lamps along every root that night.'},
 granary:{open:['The whole valley is burning, and every tree is already written down as sold.','Quartermaster Hu is destroying the proof before the Court can audit him.'],mid:'A farmer holds a sack of ash. "This was our winter," he says.',end:'In the ruins of the store you find your mother\'s seal. She bought this forest to feed people, and that was her crime.'},
 storm:{open:['It has rained here for nine years, ever since a single clear night.','Tempest Hao made the storm to wash one road clean.'],mid:'The villagers keep their roofs mended and never ask what the rain is hiding.',end:'The clouds tear open as Hao falls. You see stars over Stormwood, and the road beneath the mud has wheel ruts from your family\'s cart.'},
 canal:{open:['The low forest drowned in a single night. The sluices were closed by order.','Toll-Keeper Ma still charges for passage over the graves.'],mid:'An old ferryman says, "The water came on the day your house was struck. I cannot think why I said your house."',end:'You open the sluice. The fen begins to drain, and the toll house floats away empty.'},
 dunes:{open:['Leaves that fell a hundred years ago lie knee deep and will not rot.','One sealed crate crosses this thicket every season, bound for the Court.'],mid:'A caravan guard says, "Heavy, for a box of paper. It hums at night."',end:'You break a crate open. Inside are small things from your childhood, each tagged and numbered. They took your memories one at a time.'},
 stair:{open:['Snow muffles every sound on the ridge, and the nuns add their silence to it.','They hold the true copy of the ledger. It will take more than a question to reach it.'],mid:'A novice writes in the snow with a stick: "SHE IS SORRY." The wind takes it.',end:'Sister Ruyi breaks a vow of thirty years with one word: your name. The wind takes it before you can hold on to it.'},
 fungus:{open:['Under the great caps, the whole forest breathes as one thing.','Whatever the Court forgets, the spores remember.'],mid:'The glow pulses when you speak, as though it is listening.',end:'The Spore Mother shows you a memory that is not yours: a boy counting days in the dark, still alive.'},
 tomb:{open:['The Court buries the people it erases, standing up, with their faces turned away.','One grave in these barrows has been kept very clean.'],mid:'The lamp-lighter says, "Somebody leaves flowers. Nobody will admit to it."',end:'Inside the clean grave are your own small shoes. Someone mourned you, here, and then forgot why.'},
 archive:{open:['Birch bark curls from the trees like pages. All of it is being burned.','The Blind Archivist took out his eyes so that he would never read what he destroys.'],mid:'A clerk hides a scrap in her sleeve. "He saves one a year," she says. "He thinks we do not know."',end:'The Archivist presses a child\'s handwriting into your palm. "I could not read it," he says. "So I could not burn it."'},
 orchard:{open:['Your mother planted these trees. The rows are still straight under nine autumns of rot.','Keeper Plum tends them for the Court now, and pays her in nothing.'],mid:'An old woman offers you a plum. "From the good trees," she says. It tastes like home.',end:'You eat the last plum on the tree and remember your mother\'s hands. Just her hands. It is enough to keep walking.'},
 forge:{open:['Every gun in the Court\'s army is born in this wood, including the one you carry.','Master Smith Tie knows his own work when he sees it.'],mid:'An apprentice looks at your pistol and goes pale. "That is the collector\'s gun."',end:'Tie laughs in the sparks. "I made that for the Court\'s best collector. Whose gun did you think it was, girl?"'},
 wall:{open:['The thorns have grown for thirty years around a war that ended long ago.','General Shou still walks the line, because stopping would mean admitting it.'],mid:'A soldier asks you who they are fighting. You realize he truly does not know.',end:'General Shou unbuckles his sword and orders the gates open. Behind him, thirty years of soldiers go home.'},
 cloud:{open:['The top of the forest has its own weather and its own silence.','From up here you can finally see the red moon over the Court.'],mid:'The canopy folk bow to you. They bowed to the collector once too.',end:'"Are you certain you want to remember?" the Sage asks. You do not answer. You keep walking.'},
 crown:{open:['The first trees stand in a ring around the Court. They were old before anyone wrote anything down.','One of them has been waiting nine years for you to come home.'],mid:'The last villagers have never left the ring. They call you by a name you nearly recognize.',end:'The Oak bends and speaks your whole name into the bark. The forest never forgot you. It only waited for you to ask.'},
 temple:{open:['The moss has eaten the stairs, but the guns in the arches are new and well oiled.','The Court has turned the old holy place into a fort.'],mid:'A pilgrim whispers, "The Abbot was a kind man. Then he was given a list."',end:'The Stone Abbot cracks down the middle. Inside there is only a small book of names, each one crossed out and written back in.'},
 whisper:{open:['You hear your own voice from the branches, asking the way home.','Do not answer it. That is the first rule here.'],mid:'The villagers stuff their ears with wool and speak with their hands.',end:'The Whisperer falls silent, and for the first time in nine years the pines say nothing at all.'},
 falls:{open:['You can feel the falls in your teeth before you can see them.','The road climbs right through the water.'],mid:'A boy points at the top of the falls and mimes a chair.',end:'You find the empty chair. On the arm, someone has carved a tally that matches the one from the mine.'},
 bog:{open:['Bells ring under the mud whenever you stand still.','Every lost village still keeps time down there.'],mid:'"Do not stop walking," says the bog-keeper, walking past in circles.',end:'The bells stop. The Bog King sinks with a letter in his fist. It is your brother\'s handwriting.'},
 clearing:{open:['The forest ends. After so long under the trees, the open sky feels like falling.','Only one keeper stands between you and the Court.'],mid:'One old woman has stayed in the last village. "I knew you when you were small," she says, and for once it is true.',end:'The Last Warden lays down her gun and steps aside. "Remember this," she says. "You chose to come."'},
 court:{open:['A thousand lanterns hang in dead trees, one for each name the Court allows.','You know this clearing. You know the stand where the brush is waiting. You know the man beside it.'],mid:'Nobody here looks up. They have all been written out already.',end:''}
};

function dailyEnd(won){const r=G.run,seed=r.daily,d=store.get('ledger-daily')||{streak:0,last:0,best:{}},t=G.dailyT|0,kills=r.stat.kills,score=won?Math.max(0,5000-t*4)+kills*20+r.lives*300:kills*20;let msg='';if(won){const y=new Date();y.setDate(y.getDate()-1);d.streak=d.last===dayKey(y)||d.last===seed?(d.last===seed?d.streak:d.streak+1):1;d.last=seed;award('daily1');if(d.streak>=3)award('streak3')}const nb=score>(d.best[seed]||0);if(nb)d.best[seed]=score;store.set('ledger-daily',d);const f=q=>(q/60|0)+':'+String(q%60).padStart(2,'0'),line=`Thorncut Daily ${seed}: ${won?'cleared in '+f(t):'fell'} with ${kills} kills, score ${score}.${STORE.url?' '+STORE.url:''}`;
 menu(`<div class="scrim"><div class="slip"><div class="label">Daily Challenge</div><h2>${won?'Cleared':'You fell'}</h2><p>Score ${score}${nb?' (your best today)':''}. Time ${f(t)}, ${kills} kills. Current streak: ${d.streak} ${d.streak===1?'day':'days'}.</p><p>Everyone gets the same map today, and a new one tomorrow.</p><div class="row"><button class="primary" id="b-share" data-a="share">Copy my result</button><button id="b-again" data-a="again">Try again</button><button id="b-quit" data-a="t">Title</button></div></div></div>`,{share(){try{navigator.clipboard.writeText(line)}catch(e){}pop&&0;const b=document.getElementById('b-share');if(b)b.textContent='Copied'},again(){startDaily()},t:showTitle})}
function resume(s){G.run=s;G.coins=s.coins||0;G.dead=new Set();G.keepSeed=true;G.resumeHp=s.hpf;card(s.ch,s.ck)}
function showTitle(){G.mode='title';const last=lastSlot(),draw=()=>menu(`<div id="title"><h1 class="sr">Thorncut</h1><div class="row">${last?`<button id="b-cont" class="primary" data-a="cont">Continue<small>${DIFF[last.d].name}, chapter ${last.s.ch+1}</small></button>`:''}<button id="b-new" class="${last?'':'primary'}" data-a="new">New Game</button><button id="b-daily" data-a="daily">Daily Challenge<small>${(()=>{const d=store.get('ledger-daily');return d&&d.streak?d.streak+' days':''})()}</small></button><button id="b-end" data-a="end">Endless</button><button id="b-help" data-a="help">How to Play</button><button id="b-guide" data-a="guide">Field Guide</button><button id="b-rew" data-a="rew">Rewards</button><button id="b-keys" data-a="keys">Options</button></div></div>`,
 {end(){diffPick(d=>charPick(w=>endlessSetup(d,w)))},new(){slotMenu()},cont(){resume(last.s)},guide(){guideMenu(showTitle)},help(){helpMenu(showTitle)},rew(){rewardsMenu(showTitle)},daily(){startDaily()},keys(){optionsMenu(draw)}});draw()}
const GUIDE={gunner:['Straw Gunner','The Court\'s common soldier. Walks toward you and fires quick three-round bursts.'],rifle:['Tower Rifleman','Stands still and shows a red line before each shot. Step off the line.'],bomber:['Keg Runner','Sprints at you carrying a powder keg. Shoot it from far away.'],shield:['Shield Guard','Blocks every shot from the front. Jump over and hit from behind.'],hooded:['Hooded Raider','Fast and restless. Sprays long, loose bursts at close range.'],brute:['Iron Brute','Huge and slow. Blasts a wide fan of seven shots.'],kite:['War Kite','Drifts overhead and drops bombs on your path.'],turret:['Fort Turret','Bolted in place on towers. Fires steady four-round bursts.'],thornling:['Thornling','A tiny bramble that rushes in packs. Weak alone.'],toad:['Bog Toad','Leaps in high arcs and lands on top of you.'],crow:['Carrion Crow','A fast swooping bird that dives at your head.'],hornet:['Hornet','Very small, very fast and quick to swarm.'],beetle:['Plate Beetle','Armored in front like a shield guard. Attack from the side it is not facing.'],ranger:['Forest Ranger','Fires three spreading shots at mid range.'],mgnest:['Machine Gun Nest','A sandbagged gun with long bursts. Rush it during the pause.'],mortar:['Mortar Crew','Lobs shells that mark where they land. Keep moving.'],flamer:['Flamethrower','Closes in and burns everything in front of him.'],rocketeer:['Rocketeer','Fires slow rockets that follow you. Dodge late or shoot them down.'],drone:['Scout Drone','Hovers near you and fires short bursts from above.'],tank:['Forest Tank','A rolling fortress with 300 health and a heavy gun. Bring bombs.'],wolf:['Grey Wolf','Runs you down and leaps when close.'],boar:['Wild Boar','Tough and stubborn. Charges straight along the ground.'],bat:['Cave Bat','Flutters in a wobbling line that is hard to hit.'],spider:['Hanging Spider','Drops on a thread and spits webs.'],shroom:['Spore Cap','A rooted mushroom that spits spores.'],treant:['Elder Treant','A walking tree with 170 health and heavy blows.'],leaper:['Thorn Leaper','Jumps toward you, and each landing sends shockwaves both ways along the ground. Jump the shockwave.'],ram:['Iron Ram','Paws the ground, then charges at huge speed. If it hits a wall it is stunned and takes extra damage.'],worm:['Burrow Worm','Tunnels unseen beneath you. Watch for the moving mound, then get clear before it bursts up and spits.'],owl:['Night Owl','Circles high and dives at the spot where you stood. Keep moving under it.'],wisp:['Lantern Wisp','Fades out of this world for two seconds at a time, and nothing can hit it then. Its slow orbs follow you.'],sapling:['Walking Sapling','Slow and sturdy. When it dies it bursts into three thornlings.'],roller:['Bomb Crew','Rolls bombs along the ground from a small cannon. Jump over them.'],medic:['Field Medic','Unarmed, but heals every nearby enemy. Kill first.'],drummer:['War Drummer','Unarmed. The drumbeat makes every enemy around it fire faster.'],trapper:['Net Trapper','Throws weighted nets that slow you badly. Dashing avoids them.'],keeper:['Hive Keeper','Carries a living hive and releases hornets until you stop it.'],riverboat:['River Raider','An armed patrol boat. Only the boat gun or a good shot from the bank can stop it.'],strider:['Clockwork Strider','A two-legged war machine. Fires bursts, and stomps out shockwaves when you get close.'],crawler:['Crawler Mine','A fast little machine that scuttles at you and blows up. Shoot it early.'],sentry:['Laser Sentry','A fixed eye that tracks you with a beam, locks on, and fires a very fast bolt. Get out of the line.'],gyro:['Gyrocopter','Hovers over your head and drops bombs. Keep moving and shoot upward.'],saw:['Saw Runner','A spinning blade that races back and forth along the ground. Jump it.'],repair:['Repair Bot','Unarmed. Flies to the nearest machine and keeps fixing it. Destroy it first.'],pylon:['Tesla Pylon','Charges for a moment, then shocks everything inside the marked circle.'],golem:['Steam Golem','A huge walking furnace. Armor halves damage from the front, so get behind it.'],shieldgen:['Shield Generator','Nearby enemies take a fifth of normal damage until you destroy it.'],mirror:['Mirror Monk','Its polished shield sends your bullets back at you. Attack from behind.']};
const BUFFTXT={rapid:'Your guns fire far faster for 12 seconds.',power:'Every shot does double damage for 10 seconds.',triple:'Each shot becomes three for 12 seconds.',speed:'Run faster for 14 seconds.',magnet:'Coins fly to you for 20 seconds.',shield:'Absorbs the next hit completely.',heal:'Restores all of your health at once.'};

 else if(id==='climb'){R(16,0,12,34,'#6a5a48');R(16,0,2,34,'#94806a');for(let y=4;y<34;y+=8)R(18,y,10,1,'#3a3028');g.drawImage(spr(HERO_CLIMB[0],charArt('wu').pal),2,10)}

function guideMenu(back){const TABS={enemies:'Enemies',bosses:'Bosses',people:'People',guns:'Guns',tools:'Rides',traps:'Traps',boosts:'Pickups',vows:'Vows',shop:'Upgrades'};let tab='enemies',sel=null;
 const list=()=>{if(tab==='enemies')return Object.keys(GUIDE).filter(k=>FOE[k]&&!REMAP[k]).map(k=>({id:k,name:GUIDE[k][0],img:foeImg(k),desc:GUIDE[k][1],sub:`Health ${FOE[k].hp}`}));if(tab==='bosses')return Object.keys(BOSS).map(k=>({id:k,name:BOSS[k].name,img:bossImg(k),desc:`Guards the page at the end of its chapter. It changes its attacks when badly hurt.`,sub:`${BOSS[k].title}. Health ${BOSS[k].hp}`}));if(tab==='people')return[...Object.entries(CHARS).map(([k,c])=>({id:k,name:c.name,img:portrait(k),desc:c.desc,sub:c.role})),...['merchant','gunsmith','herbalist','elder'].map(k=>({id:k,name:NPCNAME[k][0],img:npcImg(k),desc:NPCNAME[k][1],sub:'Village'})),...['v0','v1','v2'].map((k,i)=>({id:k,name:['Village Weaver','Field Hand','Village Child'][i],img:npcImg(k),desc:'Lives in the safe villages and has something to say if you stop to listen.',sub:'Village'}))];if(tab==='guns')return Object.entries(GUNS).map(([k,g])=>({id:k,name:g.name,img:gunImg(k),desc:g.desc,sub:gunStats(k),html:1}));if(tab==='tools')return[['boat','River Boat','Press F at the river to get in. Steer with A and D, and fire the mounted machine gun with the mouse. It overheats if you hold the trigger. River water is toxic and kills on touch, so stay in the boat. Press F or Jump to get out. In the middle of the river the boat carries you to the nearest bank or platform first.','Press F to get in. Toxic water kills'],['glider','Cliff Glider','Press F at a cliff edge and sail across the chasm. Hold W to stay up and S to dive. You can shoot while gliding, and it lands by itself.','Press F to take it'],['zip','Zip Line','Stand under the line and press F. You speed up as you ride and can shoot on the way. Jump or press F to let go early.','Press F to grab on'],['stairs','Stone Stairs','Just walk. You climb them without jumping.','No button needed'],['echo','Echoes','When you die, that life returns as a ghost beside you. It reruns your attempt, fires at anything near and bursts where you fell. Up to three at once, cleared when the chapter ends.','Die, then rise again'],['car','Rail Car','Found in every tunnel. Press F on the rails. Hold the travel direction to go faster, the other way to brake. You can shoot on the way, and it rams small enemies. Coins line the track.','Press F to get in'],['roll','Snowballs','Mountains throw snowballs down their slopes. Jump them or shoot them for a coin.','Jump or shoot'],['seed','Blue Seed','Touch one in the air to get your dash back.','Touch it'],['fall','High Falls','Falling more than about eight blocks hurts, and higher falls hurt more. Water is safe.','Watch your step']].map(([id,name,desc,sub])=>({id,name,img:toolImg(id),desc,sub}));if(tab==='traps')return[['flame','Flame Jet','Hisses and sparks for a moment, then fires a tall column of fire. Wait for it to die down, then run through.','Damage 10'],['dart','Dart Head','A stone face on a wall. Its eyes blink red, then it fires a dart straight ahead. Jump or dash past it.','Damage 9'],['crush','Crusher','Waits overhead until you walk under it, shakes, then slams down. Keep moving and it misses.','Damage 18'],['rsaw','Rail Saw','A spinning blade that runs back and forth along its track. Jump over it or wait for it to pass.','Damage 12'],['pend','Swinging Blade','Swings on a steady rhythm. Watch one swing, then go.','Damage 12'],['spike','Floor Spikes','Sit in shallow pits and on platforms. Their hit area is small, so close calls count.','Damage 14'],['wspike','Wall Spikes','Line the sides of towers, houses and rock walls. Watch where you wall-jump.','Damage 14'],['thorn','Thorn Wall','Blocks the way until you defeat enough enemies. It cannot be jumped or dashed past.','Not a trap you can avoid']].map(([id,name,desc,sub])=>({id,name,img:toolImg(id),desc,sub}));if(tab==='boosts')return Object.entries(BUFF).map(([k,b])=>({id:k,name:b.name,img:tagImg(k,b.l,b.col),desc:BUFFTXT[k],sub:'Found in crates along the way'}));if(tab==='vows')return Object.entries(PERKS).map(([k,q])=>({id:k,name:q.name,img:tagImg('v'+k,q.name[0],'#ffd070'),desc:q.desc,sub:'Chosen after each chapter'}));return Object.entries(POWER).map(([k,q])=>({id:k,name:q.name,img:tagImg('p'+k,q.name[0],'#7cc2a8'),desc:q.desc,sub:'Sold by Tansy, lasts the whole run'}))};
 const draw=()=>{const q=list(),s=q.find(i=>i.id===sel)||q[0];sel=s.id;menu(`<div class="scrim"><div class="slip wide guide"><div class="gh"><h2>Field Guide</h2><button id="b-back" data-a="back">Close</button></div><div class="row tabs">${Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'on':''}" data-a="tab" data-v="${k}">${v}</button>`).join('')}</div><div class="gb"><div class="glist">${q.map(i=>`<button class="gt ${i.id===s.id?'on':''}" title="${i.name}" aria-label="${i.name}" data-a="sel" data-v="${i.id}"><img alt="" src="${i.img}"></button>`).join('')}</div><div class="gd"><div class="gi"><img alt="" src="${s.img}"></div><b>${s.name}</b><small>${s.html?'':s.sub}</small><p>${s.desc}</p>${s.html?s.sub:''}</div></div></div></div>`,{back,tab(v){tab=v;sel=null;draw()},sel(v){sel=v;draw()}})};draw()}
function helpMenu(back){const T_={basics:['The basics','<p><b>Goal.</b> Fight through each chapter, beat the boss at the end and take the page it guards.</p><p><b>Lives.</b> Falling costs a life. Run out and that difficulty starts over. Your other saves are safe.</p><p><b>Echoes.</b> When you die, that life comes back as a ghost that reruns your attempt beside you, shoots what is near and explodes where you fell. Die cleverly and your past lives clear the way.</p><p><b>Villages.</b> Marked SAFE. No fighting. Press E to shop, and you restart here after a fall.</p><p><b>Music.</b> Every chapter has its own song. It loops the whole chapter, and each repeat lands on a new random pitch.</p><p><b>Maps.</b> Every new chapter builds a new map. It stays the same when you retry, so your Echoes know the way.</p>'],walls:['Thorn walls','<p><b>What they are.</b> A wall of red thorns from the ground to the sky. Nothing gets past it, not even jumps or dashes.</p><p><b>How to open one.</b> Defeat the enemies in that stretch. The orange counter at the top left shows how many are left: 60% on First Timer, up to every one on Hard and Max.</p><p><b>Lost an enemy?</b> A flashing arrow at the screen edge points to the nearest one. Hiding does not work: after 12 seconds the thorns drag the last enemies out to you.</p><p><b>What does not count.</b> Fixed guns, snipers, spiders, burrowing worms, and anything on high ledges or in tunnels.</p>'],foes:['Enemies','<p><b>Spikes.</b> They line shallow pits and the sides of towers, houses and walls. Their hit area is small, so close calls count.</p><p><b>Traps.</b> Flame jets hiss before they fire. Dart heads blink red first. Crushers shake before they drop. Rail saws and swinging blades run on a rhythm, so time your jump.</p><p><b>Dash strikes.</b> Dash through an enemy to cut it and get your dash back at once. Landing on heads also refills it.</p><p><b>Streaks.</b> Kill quickly to chain a streak. Every five kills heals you and gives a short power boost.</p><p><b>Red line.</b> A sniper or sentry is about to fire. Step off the line.</p><p><b>Red exclamation mark.</b> Something is about to charge or burst from the ground.</p><p><b>Shields.</b> Shield Guards, Beetles and Mirror Monks block the front. Get behind them. Steam Golems take half damage from the front.</p><p><b>Kill these first.</b> Medics and Repair Bots heal others, War Drummers speed them up, and Shield Generators make them far tougher.</p><p>Open the Field Guide to see all of them.</p>'],ride:['Boat and glider','<p><b>F gets you in, and F gets you out.</b> A prompt appears at the bottom of the screen when you are close enough.</p><p><b>Zip lines.</b> Stand under a line and press F. You speed up as you ride. Jump or press F to let go, and you can shoot on the way down.</p><p><b>Boat.</b> Rivers are too fast to swim. Steer with A and D and shoot with the mounted gun. Let it cool when the bar fills.</p><p><b>Glider.</b> Press F at the cliff edge. Hold W to stay up, S to dive. It lands by itself. You cannot jump the chasm without it.</p><p><b>Blue seeds.</b> Touch one to get your air dash back.</p><p><b>High falls hurt.</b> More than about eight blocks costs health. Water is safe.</p>'],world:['Day and weather','<p><b>Day and night</b> each last five minutes. The icon at the top shows which it is.</p><p><b>Weather</b> changes at random. Fog hides enemies, wind bends the grass, and storms bring lightning.</p><p><b>Tunnels.</b> Look for vine holes in the ground. They hold chests, and each has a hidden vault behind a false wall.</p>'],keys:['Controls',KEYS_HTML]};let tab='basics';const draw=()=>menu(`<div class="scrim"><div class="slip wide help"><div class="gh"><h2>How to Play</h2><button id="b-back" data-a="back">Close</button></div><div class="row tabs">${Object.entries(T_).map(([k,v])=>`<button class="${k===tab?'on':''}" data-a="tab" data-v="${k}">${v[0]}</button>`).join('')}</div><div class="hbody">${T_[tab][1]}</div></div></div>`,{back,tab(v){tab=v;draw()}});draw()}
function rewardsMenu(back){let tab='skins';const draw=()=>{const got=achGot(),cur=curSkin();const b=tab==='skins'?`<div class="grid skins">${Object.entries(SKINS).map(([k,s])=>{const ok=skinOK(k);return`<button class="choice ${k===cur?'on':''}" data-a="wear" data-v="${k}" ${ok?'':'disabled'}><span>${s.name}</span><span class="sw2" style="background:${s.pal.c||'#34466b'};border-color:${s.pal.r||'#d3392a'}"></span><small>${ok?(k===cur?'Wearing':'Unlocked'):s.how}</small></button>`}).join('')}</div>`:`<div class="achl">${Object.entries(ACH).map(([k,a])=>`<div class="${got[k]?'done':''}"><b>${got[k]?'★':'·'} ${a[0]}</b><span>${a[1]}</span></div>`).join('')}</div>`;menu(`<div class="scrim"><div class="slip wide"><div class="gh"><h2>Rewards</h2><button id="b-back" data-a="back">Close</button></div><div class="row tabs"><button class="${tab==='skins'?'on':''}" data-a="tab" data-v="skins">Outfits</button><button class="${tab==='ach'?'on':''}" data-a="tab" data-v="ach">Achievements ${Object.keys(got).length}/${Object.keys(ACH).length}</button><button data-a="sup">Supporter Pack</button></div>${b}</div></div>`,{back,tab(v){tab=v;draw()},wear(v){store.set('ledger-skin',v);draw()},sup(){supportMenu(draw)}})};draw()}

  menu(`<div class="scrim"><div class="slip wide slots"><div class="label">Choose a save</div><p class="hint">Every difficulty keeps its own progress. Switching never touches the others.</p><div class="slotlist">${Object.entries(DIFF).map(([id,q])=>row(id,q)).join('')}</div>${info}${btns}</div></div>`,{

/* ───────────── physics ───────────── */
function boxHit(x,y,e){const l=(x-e.w/2+.5)/T|0,r=(x+e.w/2-.5)/T|0,t=(y-e.h+.5)/T|0,b=(y-.5)/T|0;for(let i=l;i<=r;i++)for(let j=t;j<=b;j++)if(solid(tAt(i,j)))return true;return false}
function unstick(p){if(p.ride==='zip'||p.ride==='car'||p.dead>0||!boxHit(p.x,p.y,p))return;for(let r=2;r<=64;r+=2)for(const[dx,dy]of[[0,-r],[-r,0],[r,0],[-r,-r],[r,-r],[0,r],[-r,r],[r,r]]){if(!boxHit(p.x+dx,p.y+dy,p)){p.x+=dx;p.y+=dy;p.vx*=.5;if(dy<0&&p.vy<0)p.vy=0;return}}if(p.safe&&!boxHit(p.safe.x,p.safe.y,p)){p.x=p.safe.x;p.y=p.safe.y;p.vx=p.vy=0}}
function moveX(e,dx){e.x+=dx;const l=(e.x-e.w/2)/T|0,r=(e.x+e.w/2-.01)/T|0,t=(e.y-e.h)/T|0,b=(e.y-.01)/T|0;e.hitW=0;if(e.ground&&dx){const c=dx>0?r:l;if((tAt(c,b)===STR||tAt(c,b)===RFE)&&!boxHit(e.x,e.y-T,e)){e.y-=T;e.stepO=T;return}}
  if(dx>0){for(let y=t;y<=b;y++)if(solid(tAt(r,y))){e.x=r*T-e.w/2;e.vx=0;e.hitW=1;break}}else if(dx<0){for(let y=t;y<=b;y++)if(solid(tAt(l,y))){e.x=(l+1)*T+e.w/2;e.vx=0;e.hitW=-1;break}}}
function moveY(e,dy){const py=e.y;e.y+=dy;e.ground=false;const l=(e.x-e.w/2)/T|0,r=(e.x+e.w/2-.01)/T|0;
  if(dy>=0){const b=e.y/T|0;for(let x=l;x<=r;x++){const q=tAt(x,b);if(solid(q)||((q===ONE||q===CRM||q===ROPE||(q===LAD&&tAt(x,b-1)!==LAD&&e.isP))&&py<=b*T+.5&&!(e.drop>0))||(q===SPR&&py<=b*T+8&&e.isP)){e.y=b*T;if(q===SPR){e.bounce=(x<<16)|b}e.vy=0;e.ground=true;break}}}
  else{const t=(e.y-e.h)/T|0;for(let x=l;x<=r;x++)if(solid(tAt(x,t))){ // nudge round corners so head bumps do not stop a good jump
      const ox=(e.x-(x*T+T/2));if(e.isP&&Math.abs(ox)>T/2+e.w/2-5&&l!==r){e.x+=sign(ox)*2;e.y=py+dy;break}
      e.y=(t+1)*T+e.h;e.vy=0;break}}}
const landX=(x,d=1)=>{let n=0;while(L.rc&&L.rc[x/T|0]&&n++<120)x+=d*T;return x};
function surface(x){for(let y=8;y<L.h-2;y++){const q=tAt(x,y);if(solid(q)||q===ONE)return y}return L.gy}
function los(x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0),n=d/8|0;for(let i=1;i<n;i++){const u=i/n;if(solid(tAt((x0+(x1-x0)*u)/T|0,(y0+(y1-y0)*u)/T|0)))return false}return true}

function hurt(d){const p=P;if(p.inv>0||p.dash>.05||p.dead||G.win>0)return false;if(G.bossOn&&!G.run.endless)d*=1.25;rumble(160,.6,.9);if(p.buff.shield>0){p.buff.shield=0;p.inv=.8;pop('SHIELD BROKE',p.x-20,p.y-28,'#a8d8ff');S.clash();return true}d*=DIFF[G.run.diff].dmg*(1+(danger()-1)*.34);d=Math.min(d,maxHp()*.45);p.hp-=d;p.inv=1.15*(DF().inv||1);p.flash=.1;blood(p.x,p.y-10,8);S.hit();S.hurt();shake(4);G.flash=.08;
